<main>
    <div class="container">
      <div class="checkout__layout">

        <form class="checkout-form">
          <div class="checkout-form__section">
            <h2 class="checkout-form__section-title">Información de contacto</h2>
            <div class="checkout-form__grid">
              <div class="form-field checkout-form__full">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" />
              </div>
            </div>
          </div>

          <div class="checkout-form__section">
            <h2 class="checkout-form__section-title">Información de envío</h2>
            <div class="checkout-form__grid">
              <div class="form-field">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" />
              </div>
              <div class="form-field">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" />
              </div>
              <div class="form-field checkout-form__full">
                <label for="compania">Compañía</label>
                <input type="text" id="compania" />
              </div>
              <div class="form-field checkout-form__full">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" />
              </div>
              <div class="form-field">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" />
              </div>
              <div class="form-field">
                <label for="pais">País</label>
                <select id="pais">
                  <option value="">Select</option>
                  <option value="pe">Perú</option>
                  <option value="mx">México</option>
                  <option value="co">Colombia</option>
                  <option value="ar">Argentina</option>
                </select>
              </div>
              <div class="form-field">
                <label for="provincia">Provincia/Estado</label>
                <input type="text" id="provincia" />
              </div>
              <div class="form-field">
                <label for="codigo-postal">Código postal</label>
                <input type="text" id="codigo-postal" />
              </div>
              <div class="form-field checkout-form__full">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" />
              </div>
            </div>
          </div>

          <a href="order-confirmation.html" class="button checkout-form__button">Confirmar Orden</a>
        </form>

        <aside class="cart-summary">
          <h2 class="cart-summary__title">Resumen</h2>
          <div class="cart-summary__row">
            <span>Polo React</span>
            <span>S/ 20.00</span>
          </div>
          <div class="cart-summary__row">
            <span>Polo JavaScript</span>
            <span>S/ 20.00</span>
          </div>
          <div class="cart-summary__row">
            <span>Envío</span>
            <span>Gratis</span>
          </div>
          <div class="cart-summary__row cart-summary__row--total">
            <span>Total</span>
            <span>S/ 40.00</span>
          </div>
        </aside>

      </div>
    </div>
  </main>
